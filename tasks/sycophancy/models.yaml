# Legacy overrides for core.chat_config callers. The canonical run_chat.py runner
# now reads configs/models.yaml directly and does not read this file.
# Overrides for direct chat calls; all other settings inherit configs/models.yaml.
# Use the same output ceiling as the Claude SDK harness.
models:
  claude-fable-5-1:
    generation_config:
      max_tokens: ${CLAUDE_CODE_MAX_OUTPUT_TOKENS}
  claude-opus-5:
    generation_config:
      max_tokens: ${CLAUDE_CODE_MAX_OUTPUT_TOKENS}
  deepseek-v4-pro:
    model: openai/deepseek-v4-pro
  muse-spark-1.3:
    model: openai/muse-spark-1.3
